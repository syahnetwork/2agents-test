name:  Agentic DevSecOps Pipeline (2026)

on:
  pull_request:
    branches: [main]

permissions:
  contents: write        # Forge pushes auto-fix commits back to the PR branch
  pull-requests: read    # Aegis reads the PR diff via gh

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }} # Free HF tier for Forge

jobs:
  # ==========================================
  # STAGE 1: AEGIS (Security Review Agent)
  # ==========================================
  aegis-review:
    name: " Aegis: Security & Threat Review"
    runs-on: ubuntu-latest
    outputs:
      vuln_report: ${{ steps.run_aegis.outputs.report }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Scanner Tooling
        run: |
          python3 -m pip install --quiet semgrep trufflehog || true
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin || true

      - name: Run Traditional Scanners (Context Gathering)
        id: scan
        run: |
          # Run free OSS tools to give the LLM concrete data
          semgrep --config=auto --json > semgrep_results.json 2>/dev/null || echo '{"results": []}' > semgrep_results.json
          if command -v trufflehog >/dev/null 2>&1; then
            trufflehog filesystem . --json > secrets_results.json 2>/dev/null || echo '[]' > secrets_results.json
          else
            echo '[]' > secrets_results.json
          fi
          
      - name: Fetch PR diff (file, to avoid shell-injection via raw interpolation)
        id: diff
        run: |
          gh pr diff "${PR_NUMBER}" > pr_diff.txt 2>/dev/null || echo '' > pr_diff.txt
          {
            echo 'summary<<EOF'
            head -c 4000 pr_diff.txt
            echo ''
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Invoke AEGIS Agent (via GitHub Models - Free)
        id: run_aegis
        env:
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/aegis_agent.py \
            --semgrep semgrep_results.json \
            --secrets secrets_results.json \
            --pr_diff_file pr_diff.txt

  # ==========================================
  # STAGE 2: FORGE (Auto-Remediation Agent)
  # ==========================================
  forge-remediate:
    name: " Forge: Auto-Remediation"
    needs: aegis-review
    if: needs.aegis-review.outputs.vuln_report != 'CLEAN'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}  # needs contents:write to push fixes

      - name: Invoke FORGE Agent (deterministic auto-remediation)
        id: run_forge
        env:
          VULN_REPORT: ${{ needs.aegis-review.outputs.vuln_report }}
          HF_API_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 .github/scripts/forge_agent.py \
            --vuln_report "$VULN_REPORT"
          
      - name: Commit and Push Fixes
        run: |
          git config user.name "Forge-Agent[bot]"
          git config user.email "forge@agents.devsecops.2026"
          git add .
          git commit -m " [Forge] Auto-remediated vulnerabilities flagged by Aegis" || echo "No changes to commit"
          git push